services:
  db:
    image: postgres:16-alpine
    container_name: basedcrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: based
      POSTGRES_PASSWORD: based
      POSTGRES_DB: basedcrm
    ports:
      - "5432:5432"
    volumes:
      - basedcrm_pgdata:/var/lib/postgresql/data
volumes:
  basedcrm_pgdata:
